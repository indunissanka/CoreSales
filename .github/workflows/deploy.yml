name: Deploy to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: SSH & PM2 Restart
    runs-on: ubuntu-latest

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            # Live site (coresales.markwu.uk) runs from /home/ubuntu under PM2 + nginx, not Docker
            if [ "$(whoami)" = "root" ]; then RUN="su - ubuntu -c"; else RUN="bash -c"; fi
            $RUN 'cd /home/ubuntu/myapps/CoreSales && git pull --no-rebase --no-edit origin main && pm2 restart CoreSales'
